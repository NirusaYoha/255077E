<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <nav>
        <a href="index.html">Home</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html">Contact</a>
    </nav>
    
    <div class="contact-box">
        <h2>Contact Me</h2>

       <form id="contactForm" onsubmit="event.preventDefault(); validateForm();">

       <label for="fullname">Name</label> <br>
       <input type="text" id="fullname"
       placeholder="Your Name" required> <br>

       <label for="email">Email</label> <br>
       <input type="email" id="email" 
       placeholder="Your Email" required> <br>

       <label for="subject">Subject</label> <br>
       <input type="text" id="subject" 
       placeholder="Subject" required> <br>
       
       <label for="message">Message</label> <br>
       <textarea id="message" placeholder="Message"></textarea> <br>
       <button type="button" onclick="validateForm()">Send Message</button>
    </form>

    <p id="error-msg" style="display:none; color:red;">Please fill in all fields</p>
    <p id="success-msg" style="display:none; color:green;">Messeage sent successfully!</p>
    </div>
    

    <script src="script.js"></script>
